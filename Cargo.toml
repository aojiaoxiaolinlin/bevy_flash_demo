[package]
name = "bevy_flash_demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { path = "../bevy", default-features = false, features = [
    "std", "async_executor", "bevy_winit", "2d_bevy_render",
    "ui_bevy_render", "webgpu", "web", "default_font", "png", "x11",
] }
bevy_flash = { path = "../bevy_flash" }
vatf = { path = "../vatf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { path = "../bevy", default-features = false, features = ["multi_threaded"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
