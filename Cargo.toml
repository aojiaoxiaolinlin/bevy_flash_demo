[package]
name = "bevy_flash_demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_winit",
    "2d_bevy_render",
    "ui_bevy_render",
    "webgpu",
    "web",
    "default_font",
    "png",
    "x11",
] }
bevy_flash = { git = "https://github.com/aojiaoxiaolinlin/bevy_flash.git" }
vatf = { git = "https://github.com/aojiaoxiaolinlin/vatf.git" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "multi_threaded",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
