<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101722">
  <title>bevy_flash · WebGPU Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><span class="eyebrow">BEVY × FLASH</span><h1>矢量动画，在浏览器里。</h1><p>VAB 离线动画 · 矢量 UI · WebGPU 渲染</p></div>
    <button id="fullscreen" type="button">全屏展示</button></header>
  <main>
    <aside aria-label="演示控制">
      <nav aria-label="选择演示">
        <button data-page="animation" aria-pressed="true">01 动画播放</button>
        <button data-page="skins" aria-pressed="false">02 皮肤切换</button>
        <button data-page="ui" aria-pressed="false">03 矢量 UI</button>
        <button data-page="buttons" aria-pressed="false">04 原生按钮</button>
      </nav>
      <label>展示素材<select id="asset" disabled></select></label>
      <section id="animation-controls" hidden>
        <label>当前动作<select id="clip"></select></label>
        <label>播放方式<select id="mode"><option value="once">单次 → fallback</option><option value="loop">循环</option>
          <option value="hold">单次 → 保持末帧</option><option value="chain">连续两次 → fallback 循环</option><option value="terminal">终态播放（锁定）</option></select></label>
        <div class="row"><button id="play">播放动作</button><button id="reset">重置终态</button></div>
        <label>默认返回动作<select id="fallback"></select></label>
      </section>
      <section id="playback-controls" hidden>
        <div class="row"><button id="pause">暂停</button><label>速度<select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>4</option></select></label></div>
        <label id="seek-label">进度 <output id="frame">—</output><input id="seek" type="range" min="0" max="0" value="0" aria-label="动画帧"></label>
      </section>
      <section id="skin-controls" hidden><h2>皮肤槽</h2><div id="skins"></div></section>
      <label id="disable-label" class="check" hidden><input id="disabled" type="checkbox">禁用画布中的按钮</label>
      <details><summary>诊断</summary><label class="check"><input id="diagnostics" type="checkbox">显示平滑帧率</label><p id="fps">关闭</p><small>含应用与浏览器开销，不是单独的滤镜 GPU 耗时。</small></details>
      <section><h2>最近事件</h2><ol id="events"><li>等待加载</li></ol></section>
    </aside>
    <div class="preview" id="preview">
      <div id="canvas-parent"><canvas id="bevy" tabindex="0" aria-label="Bevy WebGPU 渲染画布"></canvas></div>
      <div id="loading" role="status"><span class="spinner"></span><p id="loading-text">正在初始化 WebGPU…</p><button id="retry" hidden>重试加载</button></div>
      <div class="badge"><span id="state">准备中</span><span id="clicks"></span></div>
      <p id="notice" aria-live="polite">加载完成后，可以选择动作、皮肤或矢量 UI。</p>
    </div>
  </main>
  <footer>仅使用 WebGPU · 运行时播放预编译 VAB · 不执行 ActionScript · Lighten 为 Max 近似</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
