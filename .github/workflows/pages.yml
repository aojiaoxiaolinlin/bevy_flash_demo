name: WebGPU showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Cargo.lock pins crates.io and Git dependencies; no sibling checkouts are needed.
env:
  RUST_VERSION: 1.97.1
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out showcase
        uses: actions/checkout@v6
        with:
          path: bevy_flash_example
          persist-credentials: false
      - name: Install Rust and WASM target
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bevy_flash_example/target
          key: wasm-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('bevy_flash_example/Cargo.lock') }}
          restore-keys: |
            wasm-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        working-directory: bevy_flash_example
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.lock", "rb"))["package"]; print(next(x["version"] for x in p if x["name"] == "wasm-bindgen"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache matching wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: bevy_flash_example/.tools/wasm-bindgen
          key: bindgen-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ steps.bindgen.outputs.version }}
      - name: Install matching wasm-bindgen CLI
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        working-directory: bevy_flash_example
        run: cargo install wasm-bindgen-cli --version '${{ steps.bindgen.outputs.version }}' --locked --root .tools/wasm-bindgen
      - name: Check formatting
        working-directory: bevy_flash_example
        run: cargo fmt --check
      - name: Build and package release website
        working-directory: bevy_flash_example
        shell: pwsh
        run: ./build-web.ps1
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: bevy_flash_example/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
