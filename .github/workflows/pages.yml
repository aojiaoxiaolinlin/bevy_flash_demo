name: WebGPU showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Match the Bevy checkout used to validate this demo. The library/compiler
# track main during development; replace those refs with SHAs for a release.
env:
  BEVY_REF: c6f634ca9f406d68ba5109d921247b654cb42c10
  FLASH_REF: main
  VATF_REF: main
  RUST_VERSION: 1.95.0
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out showcase
        uses: actions/checkout@v6
        with:
          path: bevy_flash_example
          persist-credentials: false
      - name: Check out Bevy
        uses: actions/checkout@v6
        with:
          repository: bevyengine/bevy
          ref: ${{ env.BEVY_REF }}
          path: bevy
          persist-credentials: false
      - name: Check out renderer
        uses: actions/checkout@v6
        with:
          repository: aojiaoxiaolinlin/bevy_flash
          ref: ${{ env.FLASH_REF }}
          path: bevy_flash
          persist-credentials: false
      - name: Check out VATF
        uses: actions/checkout@v6
        with:
          repository: aojiaoxiaolinlin/vatf
          ref: ${{ env.VATF_REF }}
          path: vatf
          persist-credentials: false
      - name: Record dependency revisions
        id: revisions
        shell: bash
        run: |
          key=""
          for repo in bevy bevy_flash vatf; do
            revision="$(git -C "$repo" rev-parse HEAD)"
            echo "$repo: $revision" >> "$GITHUB_STEP_SUMMARY"
            key="$key-$revision"
          done
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Install Rust and WASM target
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bevy_flash_example/target
          key: wasm-${{ runner.os }}-${{ env.RUST_VERSION }}${{ steps.revisions.outputs.key }}-${{ hashFiles('bevy_flash_example/Cargo.lock') }}
          restore-keys: |
            wasm-${{ runner.os }}-${{ env.RUST_VERSION }}${{ steps.revisions.outputs.key }}-
      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        working-directory: bevy_flash_example
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.lock", "rb"))["package"]; print(next(x["version"] for x in p if x["name"] == "wasm-bindgen"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache matching wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: bevy_flash_example/.tools/wasm-bindgen
          key: bindgen-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ steps.bindgen.outputs.version }}
      - name: Install matching wasm-bindgen CLI
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        working-directory: bevy_flash_example
        run: cargo install wasm-bindgen-cli --version '${{ steps.bindgen.outputs.version }}' --locked --root .tools/wasm-bindgen
      - name: Check formatting
        working-directory: bevy_flash_example
        run: cargo fmt --check
      - name: Build and package release website
        working-directory: bevy_flash_example
        shell: pwsh
        run: ./build-web.ps1
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: bevy_flash_example/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
